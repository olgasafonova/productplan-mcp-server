name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false  # No external dependencies, cache not needed

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          install-only: true

      - name: Run make check
        run: make check

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: -exclude-generated ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck found vulnerabilities (see above). Stdlib issues resolve with Go patch updates."

  go-mod-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  build:
    runs-on: ubuntu-latest
    needs: [check, security]
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false  # No external dependencies, cache not needed

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o productplan-mcp-server ./cmd/productplan

      - name: Verify binary exists
        run: ls -la productplan-mcp-server*

  # Aggregator so the matrix build legs can be REQUIRED through one stable
  # context: branch protection cannot name 'build (os, arch)' legs robustly,
  # and before this job none of them gated a merge (bead claude-code-config-t68u).
  # Pattern from mediawiki-mcp-server PR #117.
  all-checks:
    name: all-checks
    if: always()
    needs: [check, security, go-mod-tidy, build]
    runs-on: ubuntu-latest
    steps:
      - name: Assert every dependency succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS"
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::Aggregate failed; these jobs did not succeed:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All dependencies succeeded."
